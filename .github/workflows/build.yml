name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_PATH: /opt/data
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone lexicon repo
        uses: actions/checkout@v4
        with:
          repository: domino14/word-game-lexica
          path: word-game-lexica
          token: ${{ secrets.LEXICA_GH_PAT }}

      - run: mv $GITHUB_WORKSPACE/word-game-lexica /opt/word-game-lexica
      # Word graphs aren't committed to the lexica repo; its script builds or
      # fetches them.
      - run: >
          /opt/word-game-lexica/build_kwgs.sh /opt/data/lexica/gaddag
          America CSW15 CSW19 CSW21 CSW24 DISC2 ECWL FISE2 FRA20 FRA24 NSF22 NWL18 NWL20 NWL23 OSPS49 OSPS50 RD28
      - run: mv /opt/word-game-lexica/letterdistributions /opt/data/letterdistributions

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"

      - name: Run tests
        run: go test $(go list ./... | grep -v wasm)
